<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تصاريح آخر 72 ساعة - African Express Travel</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');

    :root {
      --bg-warm: #F7F4EF;
      --card-bg: #FFFFFF;
      --text-main: #2C2523;
      --border-subtle: #E8E2D9;
      --primary-accent: #D96B43;
      --primary-accent-hover: #C25832;
      --secondary-accent: #5A4238;
      --secondary-accent-hover: #45322A;
      --header-bg: #FAF6F0;
    }

    body {
      background-color: var(--bg-warm) !important;
      color: var(--text-main);
      font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
      line-height: 1.6;
    }

    .main-container {
      background-color: var(--card-bg);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04) !important;
    }

    .page-title {
      color: var(--secondary-accent);
    }

    .form-label {
      font-weight: 600;
      color: var(--secondary-accent);
      font-size: 0.9rem;
      margin-bottom: 6px;
    }

    .form-control, .form-select {
      border: 1.5px solid var(--border-subtle);
      border-radius: 8px;
      padding: 8px 12px;
      color: var(--text-main);
      background-color: #FAFAFA;
      transition: all 0.2s ease;
    }

    .form-control:focus, .form-select:focus {
      background-color: #FFFFFF;
      border-color: var(--primary-accent);
      box-shadow: 0 0 0 0.25rem rgba(217, 107, 67, 0.15);
    }

    .btn-outline-custom-brown {
      color: var(--secondary-accent);
      border: 1.5px solid var(--secondary-accent);
      border-radius: 8px;
      transition: all 0.2s ease;
    }

    .btn-outline-custom-brown:hover {
      background-color: var(--secondary-accent);
      color: #FFFFFF;
    }

    .btn-outline-custom-orange {
      color: var(--primary-accent);
      border: 1.5px solid var(--primary-accent);
      border-radius: 8px;
      transition: all 0.2s ease;
    }

    .btn-outline-custom-orange:hover {
      background-color: var(--primary-accent);
      color: #FFFFFF;
    }

    .dropdown-menu-column-filter {
      min-width: 230px;
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
    }

    .table-custom {
      border-color: var(--border-subtle);
    }

    .table-custom thead {
      background-color: var(--secondary-accent) !important;
      color: #FFFFFF;
    }

    .table-custom th {
      font-weight: 600;
      padding: 12px;
      border-bottom: none;
    }

    .table-custom td {
      padding: 10px;
    }

    .summary-box {
      background-color: var(--header-bg) !important;
      border: 1.5px solid var(--border-subtle) !important;
      border-radius: 12px;
    }

    .text-success-custom {
      color: #2E7D32 !important;
    }
  </style>
</head>
<body class="p-3 p-md-4">

  <div class="container-fluid main-container p-4 rounded">
    <!-- الهيدر -->
    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3" style="border-color: var(--border-subtle) !important;">
      <h3 class="mb-0 fw-bold page-title">📋 تصاريح آخر 72 ساعة</h3>
      <a href="index.html" class="btn btn-outline-custom-brown fw-bold">العودة للرئيسية ←</a>
    </div>

    <!-- أدوات التحكم والفلترة -->
    <div class="row mb-3 g-3 align-items-end justify-content-between">
      
      <!-- البحث النصي -->
      <div class="col-md-2">
        <label class="form-label fw-bold">بحث عام:</label>
        <input type="text" id="searchInput" class="form-control" placeholder="بحث...">
      </div>

      <!-- فلتر الشركة -->
      <div class="col-md-3">
        <label class="form-label fw-bold">الشركة:</label>
        <select id="companyFilter" class="form-select">
          <option value="">جميع الشركات</option>
          <option value="افريكان اكسبريس">افريكان اكسبريس</option>
          <option value="أي ديال تورز">أي ديال تورز</option>
          <option value="سيفين">سيفين</option>
          <option value="فوياج">فوياج</option>
        </select>
      </div>

      <!-- فلتر التاريخ -->
      <div class="col-md-5">
        <div class="row g-2">
          <div class="col-6">
            <label class="form-label fw-bold">من تاريخ الرحلة:</label>
            <input type="date" id="startDate" class="form-control">
          </div>
          <div class="col-6">
            <label class="form-label fw-bold">إلى تاريخ الرحلة:</label>
            <input type="date" id="endDate" class="form-control">
          </div>
        </div>
      </div>

      <!-- فلتر الأعمدة -->
      <div class="col-md-auto">
        <div class="dropdown">
          <button class="btn btn-outline-custom-orange dropdown-toggle fw-bold" type="button" id="columnFilterDropdown" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">
            🔍 فلتر الأعمدة الظاهرة
          </button>
          <div class="dropdown-menu dropdown-menu-column-filter p-3 shadow" aria-labelledby="columnFilterDropdown">
            <h6 class="dropdown-header px-0 text-dark fw-bold border-bottom pb-2 mb-2" style="border-color: var(--border-subtle) !important;">تحديد الأعمدة للعرض:</h6>
            
            <div class="form-check mb-2">
              <input class="form-check-input column-toggle" type="checkbox" id="col-client" data-col="1" checked>
              <label class="form-check-label" for="col-client">العميل</label>
            </div>
            <div class="form-check mb-2">
              <input class="form-check-input column-toggle" type="checkbox" id="col-tripType" data-col="2" checked>
              <label class="form-check-label" for="col-tripType">نوع الرحلة</label>
            </div>
            <div class="form-check mb-2">
              <input class="form-check-input column-toggle" type="checkbox" id="col-from" data-col="3" checked>
              <label class="form-check-label" for="col-from">من</label>
            </div>
            <div class="form-check mb-2">
              <input class="form-check-input column-toggle" type="checkbox" id="col-to" data-col="4" checked>
              <label class="form-check-label" for="col-to">إلى</label>
            </div>
            <div class="form-check mb-2">
              <input class="form-check-input column-toggle" type="checkbox" id="col-nationality" data-col="5" checked>
              <label class="form-check-label" for="col-nationality">الجنسية العامة</label>
            </div>
            <div class="form-check mb-2">
              <input class="form-check-input column-toggle" type="checkbox" id="col-pax" data-col="6" checked>
              <label class="form-check-label" for="col-pax">العدد</label>
            </div>
            <div class="form-check mb-2">
              <input class="form-check-input column-toggle" type="checkbox" id="col-carType" data-col="7" checked>
              <label class="form-check-label" for="col-carType">نوع العربية</label>
            </div>
            <div class="form-check mb-2">
              <input class="form-check-input column-toggle" type="checkbox" id="col-carName" data-col="8" checked>
              <label class="form-check-label" for="col-carName">اسم العربية</label>
            </div>
            <div class="form-check mb-2">
              <input class="form-check-input column-toggle" type="checkbox" id="col-carNumber" data-col="9" checked>
              <label class="form-check-label" for="col-carNumber">رقم العربية</label>
            </div>
            <div class="form-check mb-2">
              <input class="form-check-input column-toggle" type="checkbox" id="col-driverName" data-col="10" checked>
              <label class="form-check-label" for="col-driverName">اسم السائق</label>
            </div>
            <div class="form-check mb-2">
              <input class="form-check-input column-toggle" type="checkbox" id="col-cost" data-col="11" checked>
              <label class="form-check-label" for="col-cost">الكوست</label>
            </div>
          </div>
        </div>
      </div>

    </div>

    <!-- جدول البيانات -->
    <div class="table-responsive">
      <table class="table table-bordered table-hover text-center align-middle table-custom" id="permitsTable">
        <thead>
          <tr>
            <th>#</th>
            <th data-col-index="1">العميل</th>
            <th data-col-index="2">نوع الرحلة</th>
            <th data-col-index="3">من</th>
            <th data-col-index="4">إلى</th>
            <th data-col-index="5">الجنسية العامة</th>
            <th data-col-index="6">العدد</th>
            <th data-col-index="7">نوع العربية</th>
            <th data-col-index="8">اسم العربية</th>
            <th data-col-index="9">رقم العربية</th>
            <th data-col-index="10">اسم السائق</th>
            <th data-col-index="11">الكوست</th>
          </tr>
        </thead>
        <tbody id="permitsTableBody">
          <tr><td colspan="12" class="text-center">جاري تحميل البيانات من الشيت...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- الملخص -->
    <div class="d-flex justify-content-between align-items-center mt-3 p-3 summary-box flex-wrap gap-2">
      <div class="fw-bold text-secondary">
        📊 أعداد السيارات المعروضة: <span id="carTypesCount" class="text-dark">ليموزين: 0 | ميكروباص: 0 | كوستر: 0 | اوتوبيس: 0</span>
      </div>
      <h5 class="mb-0 fw-bold text-dark">
        إجمالي الكوست : <span id="totalCostSum" class="text-success-custom fw-bold">0 ج</span>
      </h5>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxNsd0GPwpfhFiNxsnLFm-N__ALxPGAc79ogpqoNfy4pXZs3Dywb_fh_qQbskxgfA/exec";

    const carPrices = {
      "ليموزين": 250,
      "ميكروباص": 450,
      "كوستر": 450,
      "اوتوبيس": 600
    };

    let permits = [];

    // دالة تحويل مختلف صيغ التاريخ إلى صيغة YYYY-MM-DD المقبولة في المقارنة
    function normalizeDateString(dateVal) {
      if (!dateVal) return '';
      let str = String(dateVal).trim();
      
      // التعامل مع صيغ ISO التي تحتوي على T
      if (str.includes('T')) {
        const dt = new Date(str);
        if (!isNaN(dt.getTime())) {
          const yy = dt.getFullYear();
          const mm = String(dt.getMonth() + 1).padStart(2, '0');
          const dd = String(dt.getDate()).padStart(2, '0');
          return `${yy}-${mm}-${dd}`;
        }
        str = str.split('T')[0];
      }

      // إذا كان التاريخ مسبقاً بأسلوب YYYY-MM-DD
      if (/^\d{4}-\d{2}-\d{2}$/.test(str)) {
        return str;
      }

      // التعامل مع صيغ مثل M/D/YYYY أو MM/DD/YYYY أو MM/DD/YYYY HH:MM:SS
      const spaceSplit = str.split(' ')[0];
      const parts = spaceSplit.split('/');
      if (parts.length === 3) {
        let m = parts[0].padStart(2, '0');
        let d = parts[1].padStart(2, '0');
        let y = parts[2];
        if (y.length === 4) return `${y}-${m}-${d}`;
      }

      // تحويل تاريخ غير معالج عبر JavaScript Date كخيار أخير
      const parsed = new Date(dateVal);
      if (!isNaN(parsed.getTime())) {
        const y = parsed.getFullYear();
        const m = String(parsed.getMonth() + 1).padStart(2, '0');
        const d = String(parsed.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
      }

      return str;
    }

    // جلب البيانات مباشرة من الشيت عبر الـ Web App
    async function fetchTripsFromSheet() {
      const token = localStorage.getItem('userToken') || '';

      try {
        const response = await fetch(`${WEB_APP_URL}?token=${encodeURIComponent(token)}&sheet=trips`);
        const data = await response.json();

        if (Array.isArray(data)) {
          permits = data;
          renderPermitsTable();
        } else if (data.status === 'error') {
          document.getElementById('permitsTableBody').innerHTML = `<tr><td colspan="12" class="text-danger">خطأ: ${data.error || data.message}</td></tr>`;
        }
      } catch (err) {
        console.error('Fetch Error:', err);
        document.getElementById('permitsTableBody').innerHTML = '<tr><td colspan="12" class="text-danger">فشل الاتصال بالشيت. يرجى التحقق من الاتصال بالإنترنت.</td></tr>';
      }
    }

    function renderPermitsTable() {
      const tbody = document.getElementById('permitsTableBody');
      tbody.innerHTML = '';

      if (!permits || permits.length === 0) {
        tbody.innerHTML = '<tr><td colspan="12" class="text-center text-muted">لا توجد رحلات مسجلة في الشيت</td></tr>';
        return;
      }

      const seventyTwoHoursInMs = 72 * 60 * 60 * 1000;
      const currentTime = new Date().getTime();

      const filterText = document.getElementById('searchInput').value.toLowerCase().trim();
      const selectedCompany = document.getElementById('companyFilter').value.trim();
      
      const startDateInput = document.getElementById('startDate').value; // YYYY-MM-DD
      const endDateInput = document.getElementById('endDate').value;     // YYYY-MM-DD

      let visibleIndex = 1;
      let totalCost = 0;

      const counts = {
        "ليموزين": 0,
        "ميكروباص": 0,
        "كوستر": 0,
        "اوتوبيس": 0
      };

      permits.forEach((permit) => {
        // 1. تصفية آخر 72 ساعة حسب تاريخ التسجيل Timestamp
        if (permit.timestamp) {
          const createdDate = new Date(permit.timestamp);
          const permitTime = createdDate.getTime();
          if (!isNaN(permitTime) && (currentTime - permitTime > seventyTwoHoursInMs)) {
            return;
          }
        }

        // 2. فلترة الشركة
        if (selectedCompany && String(permit.company_name || '').trim() !== selectedCompany) {
          return;
        }

        // 3. فلترة تاريخ الرحلة الدقيقة (مقارنة النصوص بالنمط YYYY-MM-DD)
        const tripDateFormatted = normalizeDateString(permit.trip_date);
        
        if (startDateInput && tripDateFormatted && tripDateFormatted < startDateInput) {
          return;
        }
        if (endDateInput && tripDateFormatted && tripDateFormatted > endDateInput) {
          return;
        }

        const carType = permit.car_type || "غير محدد";
        const costValue = carPrices[carType] !== undefined ? carPrices[carType] : (parseInt(permit.cost) || 0);
        const costStr = `${costValue} ج`;

        const clientName = permit.client_name || '-';
        const matches = 
          (permit.company_name && permit.company_name.toLowerCase().includes(filterText)) ||
          clientName.toLowerCase().includes(filterText) ||
          (permit.trip_type && permit.trip_type.toLowerCase().includes(filterText)) ||
          (permit.from_location && permit.from_location.toLowerCase().includes(filterText)) ||
          (permit.to_location && permit.to_location.toLowerCase().includes(filterText)) ||
          (permit.nationality && permit.nationality.toLowerCase().includes(filterText)) ||
          carType.toLowerCase().includes(filterText) ||
          (permit.car_name && permit.car_name.toLowerCase().includes(filterText)) ||
          (permit.car_number && String(permit.car_number).toLowerCase().includes(filterText)) ||
          (permit.driver_name && permit.driver_name.toLowerCase().includes(filterText));

        if (!matches) return;

        totalCost += costValue;
        if (counts[carType] !== undefined) {
          counts[carType]++;
        }

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${visibleIndex++}</td>
          <td data-col-index="1">${clientName}</td>
          <td data-col-index="2">${permit.trip_type || '-'}</td>
          <td data-col-index="3">${permit.from_location || '-'}</td>
          <td data-col-index="4">${permit.to_location || '-'}</td>
          <td data-col-index="5">${permit.nationality || '-'}</td>
          <td data-col-index="6">${permit.pax_count || 0}</td>
          <td data-col-index="7">${carType}</td>
          <td data-col-index="8">${permit.car_name || '-'}</td>
          <td data-col-index="9">${permit.car_number || '-'}</td>
          <td data-col-index="10">${permit.driver_name || '-'}</td>
          <td data-col-index="11" class="fw-bold text-success-custom">${costStr}</td>
        `;
        tbody.appendChild(tr);
      });

      if (visibleIndex === 1) {
        tbody.innerHTML = '<tr><td colspan="12" class="text-center text-muted">لا توجد نتائج تطابق خيارات البحث</td></tr>';
      }

      document.getElementById('totalCostSum').textContent = `${totalCost} ج`;
      document.getElementById('carTypesCount').textContent = 
        `ليموزين: ${counts["ليموزين"]} | ميكروباص: ${counts["ميكروباص"]} | كوستر: ${counts["كوستر"]} | اوتوبيس: ${counts["اوتوبيس"]}`;

      applyColumnVisibility();
    }

    function applyColumnVisibility() {
      const checkboxes = document.querySelectorAll('.column-toggle');
      checkboxes.forEach(cb => {
        const colIndex = cb.getAttribute('data-col');
        const isChecked = cb.checked;

        const th = document.querySelector(`th[data-col-index="${colIndex}"]`);
        if (th) th.style.display = isChecked ? '' : 'none';

        const tds = document.querySelectorAll(`td[data-col-index="${colIndex}"]`);
        tds.forEach(td => td.style.display = isChecked ? '' : 'none');
      });
    }

    document.querySelectorAll('.column-toggle').forEach(checkbox => {
      checkbox.addEventListener('change', applyColumnVisibility);
    });

    document.getElementById('searchInput').addEventListener('input', renderPermitsTable);
    document.getElementById('companyFilter').addEventListener('change', renderPermitsTable);
    document.getElementById('startDate').addEventListener('change', renderPermitsTable);
    document.getElementById('endDate').addEventListener('change', renderPermitsTable);

    window.addEventListener('DOMContentLoaded', fetchTripsFromSheet);
  </script>
</body>
</html>
